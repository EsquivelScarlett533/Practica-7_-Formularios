<!DOCTYPE html>
<html lang="en">
<!-- Sección de configuración y metadatos de la página -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formularios en HTML</title>
  <!-- Libreria de iconos en linea -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<!-- Sección con el contenido visible de la página -->
<body>
  <h2>Formularios con checkbox</h2>

  <!-- Contenedor principal del formulario -->
  <form action="" method="post">

    <!-- Apartado para ingresar el nombre -->
    Ingresa tu nombre:
    <input type="text" name="nombre">
    <br>

    <!-- Apartado para la selección múltiple de lenguajes de programación -->
    Selecciona los lenguajes que conozcas:
    <br>
    <input type="checkbox" name="Java">Java <br>
    <input type="checkbox" name="Python"> Python <br>
    <input type="checkbox" name="C#">C# <br>
    <input type="checkbox" name="Flutter"> Flutter <br>

  </form>
</body>
