<!DOCTYPE html>
<html lang="en">
<!-- Sección de configuración y metadatos de la página -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formularios en HTML</title>
  <!-- Libreria de iconos en linea -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<!-- Sección con el contenido visible de la página -->
<body>
  <h2>Formulario con limitaciones</h2>

  <!-- Contenedor principal del formulario -->
  <form action="" method="post">

    <!-- Apartado con campo deshabilitado (no interactivo) -->
    Ingresa tu nombre:
    <!-- Desahbilitacion de campo -->
    <input type="text" name="nombre" disabled><br>

    <!-- Apartado con limitación en el número máximo de caracteres permitidos -->
    <!-- Limitacion de caracteres -->
    Contraseña:
    <input type="password" name="pass" maxlength="5"><br>

    <!-- Apartado con campo de solo lectura (no editable) -->
    <!-- Solo lectura -->
    Comentarios:
    <textarea name="comentarios" readonly>

Este es mi comentario y no se puede borrar
</textarea><br>

  </form>
</body>
